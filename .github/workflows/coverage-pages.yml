name: Coverage Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: coverage-pages
  cancel-in-progress: false

jobs:
  coverage:
    name: Measure and publish coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and JaCoCo report
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Load previous history from Pages
        continue-on-error: true
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo='${{ github.event.repository.name }}'
          curl -fsSL "https://${owner}.github.io/${repo}/history.json" \
            -o docs/coverage/history.json || true

      - name: Append coverage point
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          root = ET.parse("build/reports/jacoco/test/jacocoTestReport.xml").getroot()
          covered = missed = 0
          for c in root.findall("counter"):
              if c.get("type") == "INSTRUCTION":
                  covered = int(c.get("covered", 0))
                  missed = int(c.get("missed", 0))
          total = covered + missed
          pct = round(100 * covered / total, 1) if total else 0.0

          path = "docs/coverage/history.json"
          try:
              history = json.load(open(path, encoding="utf-8"))
              if not isinstance(history, list):
                  history = []
          except Exception:
              history = []

          commit = os.environ.get("GITHUB_SHA", "")[:7]
          history = [h for h in history if h.get("commit") != commit]
          history.append({
              "date": datetime.now(timezone.utc).strftime("%Y-%m-%d"),
              "commit": commit,
              "coverage": pct,
          })
          json.dump(history, open(path, "w", encoding="utf-8"), indent=2)
          open(path, "a", encoding="utf-8").write("\n")
          print(pct)
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/coverage

  deploy:
    name: Deploy to GitHub Pages
    needs: coverage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
