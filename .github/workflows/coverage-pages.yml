name: Coverage Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: coverage-pages
  cancel-in-progress: false

jobs:
  coverage:
    name: Measure and publish coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and JaCoCo report
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Load previous history from Pages
        continue-on-error: true
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo='${{ github.event.repository.name }}'
          url="https://${owner}.github.io/${repo}/history.json"
          curl -fsSL "$url" -o docs/coverage/history.json || true

      - name: Append coverage point
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          tree = ET.parse("build/reports/jacoco/test/jacocoTestReport.xml")
          root = tree.getroot()
          covered = missed = 0
          for counter in root.findall("counter"):
              if counter.get("type") == "INSTRUCTION":
                  covered = int(counter.get("covered", 0))
                  missed = int(counter.get("missed", 0))
          total = covered + missed
          pct = round(100.0 * covered / total, 2) if total else 0.0

          path = "docs/coverage/history.json"
          try:
              with open(path, encoding="utf-8") as f:
                  history = json.load(f)
              if not isinstance(history, list):
                  history = []
          except (OSError, json.JSONDecodeError):
              history = []

          commit = os.environ.get("GITHUB_SHA", "local")[:7]
          entry = {
              "date": datetime.now(timezone.utc).strftime("%Y-%m-%d"),
              "commit": commit,
              "coverage": pct,
          }
          history = [h for h in history if h.get("commit") != commit]
          history.append(entry)

          with open(path, "w", encoding="utf-8") as f:
              json.dump(history, f, indent=2)
              f.write("\n")

          print(f"instruction coverage: {pct}% ({len(history)} points)")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/coverage

  deploy:
    name: Deploy to GitHub Pages
    needs: coverage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
