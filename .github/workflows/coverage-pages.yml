name: coverage-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  coverage-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew test jacocoTestReport --no-daemon

      - name: Coverage-Wert bestimmen
        run: echo "COVERAGE=$(bash scripts/coverage.sh)" >> "$GITHUB_ENV"

      - name: Bisherige Historie holen
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Seite zusammenstellen
        run: |
          mkdir -p site
          cp pages/index.html site/index.html
          if [ -f gh-pages/coverage-history.csv ]; then
            cp gh-pages/coverage-history.csv site/coverage-history.csv
          else
            echo "Datum,Commit,Coverage" > site/coverage-history.csv
          fi
          echo "$(date +%F),${GITHUB_SHA:0:7},${COVERAGE}" >> site/coverage-history.csv

      - name: Auf gh-pages veroeffentlichen
        run: |
          cd site
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -q -m "coverage: ${COVERAGE}% (${GITHUB_SHA:0:7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
