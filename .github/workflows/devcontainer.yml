name: Devcontainer

on:
  push:
    branches: [main]
    paths:
      - .devcontainer/Dockerfile
      - .devcontainer/VERSION
  pull_request:
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.vars.outputs.version }}
      name: ${{ steps.vars.outputs.name }}
      image: ${{ steps.vars.outputs.image }}
      release: ${{ steps.vars.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Image name
        id: vars
        env:
          RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          version="$(cat .devcontainer/VERSION)"
          if ! grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' <<< "$version"; then
            echo "::error file=.devcontainer/VERSION::'${version}' is not a x.y.z version"
            exit 1
          fi
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          name="ghcr.io/${owner}/tictactest-m450"
          {
            echo "version=${version}"
            echo "name=${name}"
            echo "image=${name}:v${version}"
            echo "release=${RELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: steps.vars.outputs.release == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check version
        id: check
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if out="$(docker buildx imagetools inspect "$IMAGE" --format '{{ json .Image }}' 2>&1)"; then
            released=true
            revision="$(jq -r '.config.Labels["org.opencontainers.image.revision"] // ""' <<< "$out")"
          elif grep -q 'not found' <<< "$out"; then
            released=false
          else
            echo "$out"
            exit 1
          fi
          echo "released=${released}" >> "$GITHUB_OUTPUT"
          if [ "$released" = false ]; then
            exit 0
          fi
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              changed="$(git diff --name-only "$BASE_SHA" HEAD -- .devcontainer/Dockerfile)"
              if [ -n "$changed" ]; then
                echo "::error file=.devcontainer/VERSION::Dockerfile changed but ${IMAGE} is already released, bump .devcontainer/VERSION"
                exit 1
              fi
              ;;
            push)
              if [ "$revision" != "$GITHUB_SHA" ]; then
                echo "::error file=.devcontainer/VERSION::${IMAGE} is already released, bump .devcontainer/VERSION"
                exit 1
              fi
              echo "::notice::${IMAGE} was already pushed from this commit"
              ;;
            *)
              echo "::notice::${IMAGE} is already released"
              ;;
          esac

      - name: Build
        if: steps.vars.outputs.release != 'true' || steps.check.outputs.released == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          load: true
          tags: |
            ${{ steps.vars.outputs.image }}
            ${{ steps.vars.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check image
        if: steps.vars.outputs.release != 'true' || steps.check.outputs.released == 'false'
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
        run: |
          docker run --rm "$IMAGE" sh -c 'java -version && gradle --version && test "$(id -u dev):$(id -g dev)" = 1000:1000'
          docker run --rm -v "$PWD:/workspace" -w /workspace "$IMAGE" ./gradlew test --no-daemon

      - name: Push
        if: steps.vars.outputs.release == 'true' && steps.check.outputs.released == 'false'
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          NAME: ${{ steps.vars.outputs.name }}
        run: |
          docker push "$IMAGE"
          docker push "${NAME}:latest"

  update-pr:
    name: Create update PR
    needs: image
    if: needs.image.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check deploy key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::secret DEPLOY_KEY is missing"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Update image
        env:
          NAME: ${{ needs.image.outputs.name }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          sed -i -E "s#${NAME}:[A-Za-z0-9._-]+#${IMAGE}#g" .devcontainer/devcontainer.json .github/workflows/*.yml
          for f in .devcontainer/devcontainer.json .github/workflows/ci.yml; do
            if ! grep -qF "$IMAGE" "$f"; then
              echo "::error file=${f}::${IMAGE} not found after update"
              exit 1
            fi
          done
          if grep -rn "${NAME}:" .devcontainer .github | grep -vF "$IMAGE"; then
            echo "::error::old image tag still in use"
            exit 1
          fi
          git diff

      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          branch: update-devcontainer-image
          delete-branch: true
          commit-message: use devcontainer image v${{ needs.image.outputs.version }}
          title: DevContainer-Image v${{ needs.image.outputs.version }} verwenden
          body: |
            - neues freigegebenes Image: `${{ needs.image.outputs.image }}`
            - setzt das Image in `.devcontainer/devcontainer.json` und `.github/workflows/ci.yml`
          reviewers: bernedom, Seismix

      - name: Check reviewers
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          requested="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/requested_reviewers" --jq '.users[].login')"
          echo "$requested"
          for r in bernedom Seismix; do
            if ! grep -qx "$r" <<< "$requested"; then
              echo "::error::${r} is not requested as reviewer on #${PR}"
              exit 1
            fi
          done
