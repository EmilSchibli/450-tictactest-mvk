name: Coverage History

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: coverage-history
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: "25.0.4+1.1"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Test and JaCoCo report
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Get old history
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch --depth=1 origin gh-pages
            git show FETCH_HEAD:coverage-history/history.csv > out/history.csv
          elif [ $? -eq 2 ]; then
            echo "Datum,Commit,Instruction,Branch" > out/history.csv
          else
            exit 1
          fi

      - name: Add coverage to history
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, datetime, os, sys
          root = ET.parse("build/reports/jacoco/test/jacocoTestReport.xml").getroot()
          pct = {}
          for c in root.findall("counter"):
              covered, missed = int(c.get("covered")), int(c.get("missed"))
              if covered + missed > 0:
                  pct[c.get("type")] = round(100 * covered / (covered + missed), 1)
          if "INSTRUCTION" not in pct or "BRANCH" not in pct:
              sys.exit("INSTRUCTION or BRANCH counter missing in jacoco report")
          sha = os.environ["GITHUB_SHA"][:7]
          text = open("out/history.csv").read()
          if sha in [line.split(",")[1] for line in text.splitlines()[1:] if line]:
              print(sha, "is already in history.csv")
          else:
              if not text.endswith("\n"):
                  text += "\n"
              row = [datetime.date.today().isoformat(), sha,
                     str(pct["INSTRUCTION"]), str(pct["BRANCH"])]
              print(",".join(row))
              open("out/history.csv", "w").write(text + ",".join(row) + "\n")
          EOF
          cp docs/coverage-history/index.html out/

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: out
          target-folder: coverage-history
