name: Coverage History

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: coverage-history
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: zulu
          java-version: "25.0.4+1"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Test and JaCoCo report
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Get old history
        run: |
          mkdir -p out
          git fetch --depth=1 origin gh-pages || true
          git show origin/gh-pages:coverage-history/history.csv > out/history.csv \
            || echo "Datum,Commit,Instruction,Branch" > out/history.csv

      - name: Add coverage to history
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, datetime, os
          root = ET.parse("build/reports/jacoco/test/jacocoTestReport.xml").getroot()
          pct = {}
          for c in root.findall("counter"):
              covered, missed = int(c.get("covered")), int(c.get("missed"))
              pct[c.get("type")] = round(100 * covered / (covered + missed), 1)
          row = [datetime.date.today().isoformat(), os.environ["GITHUB_SHA"][:7],
                 str(pct.get("INSTRUCTION", 0)), str(pct.get("BRANCH", 0))]
          print(",".join(row))
          open("out/history.csv", "a").write(",".join(row) + "\n")
          EOF
          cp docs/coverage-history/index.html out/

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: out
          target-folder: coverage-history
