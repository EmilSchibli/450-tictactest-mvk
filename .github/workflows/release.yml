name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check that the tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' <<< "$version"; then
            echo "::error::${GITHUB_REF_NAME} is not vX.Y.Z"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: "25.0.4+1.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Build executable JAR
        run: ./gradlew jar --no-daemon "-Pversion=${VERSION}"

      - name: Create release notes
        run: |
          notes="$(awk -v v="$VERSION" 'index($0, "## " v " ") == 1 {f=1; next} /^## / {f=0} f' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            echo "::error file=CHANGELOG.md::no section for ${VERSION}"
            exit 1
          fi
          {
            echo "Tag: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "Änderungen:"
            echo "$notes"
            echo
            echo "Artefakt: tictactest-${VERSION}.jar"
          } > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/libs/tictactest-${VERSION}.jar" \
            --title "TicTacTest $GITHUB_REF_NAME" \
            --notes-file release-notes.md
