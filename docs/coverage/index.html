<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TicTacToe coverage history</title>
  <style>
    body {
      font-family: Georgia, "Times New Roman", serif;
      max-width: 42rem;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #1a1a1a;
      background: #f7f4ef;
    }
    h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
    p { color: #444; }
    canvas {
      width: 100%;
      height: 180px;
      background: #fff;
      border: 1px solid #ccc;
      margin: 1rem 0;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 0.4rem 0.5rem;
      border-bottom: 1px solid #ddd;
      font-family: Consolas, monospace;
      font-size: 0.95rem;
    }
    th { font-family: Georgia, serif; }
  </style>
</head>
<body>
  <h1>Instruction coverage over time</h1>
  <p>JaCoCo instruction coverage for M450 TicTacToe (updated on each push to main).</p>
  <canvas id="chart" width="640" height="180"></canvas>
  <table>
    <thead>
      <tr><th>Date</th><th>Commit</th><th>Coverage %</th></tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="3">Loading…</td></tr>
    </tbody>
  </table>
  <script>
    function drawChart(entries) {
      const canvas = document.getElementById('chart');
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      if (!entries.length) return;

      const pad = 24;
      const values = entries.map(e => e.coverage);
      const min = Math.min(0, ...values);
      const max = Math.max(100, ...values);

      ctx.strokeStyle = '#bbb';
      ctx.beginPath();
      ctx.moveTo(pad, pad);
      ctx.lineTo(pad, h - pad);
      ctx.lineTo(w - pad, h - pad);
      ctx.stroke();

      const n = entries.length;
      const xAt = i => pad + (n === 1 ? (w - 2 * pad) / 2 : (i * (w - 2 * pad) / (n - 1)));
      const yAt = v => h - pad - ((v - min) / (max - min || 1)) * (h - 2 * pad);

      ctx.strokeStyle = '#2c5f2d';
      ctx.lineWidth = 2;
      ctx.beginPath();
      entries.forEach((e, i) => {
        const x = xAt(i);
        const y = yAt(e.coverage);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      ctx.fillStyle = '#2c5f2d';
      entries.forEach((e, i) => {
        ctx.beginPath();
        ctx.arc(xAt(i), yAt(e.coverage), 3.5, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    fetch('history.json')
      .then(r => r.json())
      .then(data => {
        const rows = document.getElementById('rows');
        if (!data.length) {
          rows.innerHTML = '<tr><td colspan="3">No entries yet.</td></tr>';
          return;
        }
        rows.innerHTML = data
          .slice()
          .reverse()
          .map(e => `<tr><td>${e.date}</td><td>${e.commit}</td><td>${e.coverage}</td></tr>`)
          .join('');
        drawChart(data);
      })
      .catch(() => {
        document.getElementById('rows').innerHTML =
          '<tr><td colspan="3">Could not load history.json</td></tr>';
      });
  </script>
</body>
</html>
