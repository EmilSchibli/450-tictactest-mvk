<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Coverage history</title>
  <style>
    body { font-family: sans-serif; margin: 2em; max-width: 40em; }
    canvas { border: 1px solid #444; width: 100%; height: 160px; }
    table { border-collapse: collapse; margin-top: 1em; width: 100%; }
    th, td { border: 1px solid #aaa; padding: 4px 8px; text-align: left; }
  </style>
</head>
<body>
  <h1>Coverage over time</h1>
  <canvas id="c" width="600" height="160"></canvas>
  <table>
    <thead><tr><th>date</th><th>commit</th><th>%</th></tr></thead>
    <tbody id="t"></tbody>
  </table>
  <script>
    fetch('history.json').then(r => r.json()).then(data => {
      const t = document.getElementById('t');
      t.innerHTML = data.slice().reverse().map(e =>
        '<tr><td>' + e.date + '</td><td>' + e.commit + '</td><td>' + e.coverage + '</td></tr>'
      ).join('') || '<tr><td colspan="3">no data</td></tr>';

      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const pad = 20;
      const w = canvas.width - pad * 2;
      const h = canvas.height - pad * 2;
      if (!data.length) return;
      ctx.beginPath();
      data.forEach((e, i) => {
        const x = pad + (data.length === 1 ? w / 2 : i * w / (data.length - 1));
        const y = pad + h - (e.coverage / 100) * h;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
      data.forEach((e, i) => {
        const x = pad + (data.length === 1 ? w / 2 : i * w / (data.length - 1));
        const y = pad + h - (e.coverage / 100) * h;
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();
      });
    });
  </script>
</body>
</html>
